name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:       # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#9370DB&color_dots=#ebedf0,#d8c8f0,#b9a0e6,#9370DB,#5e3a9e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#9370DB&color_dots=#161b22,#2e1f4a,#4b2f7a,#7451b8,#9370DB

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
